name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # Gitleaks
      # =========================
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # Semgrep
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config auto

      # =========================
      # Dependency Scan
      # =========================
      - name: Install Backend Dependencies
        working-directory: Backend
        run: npm ci

      - name: Run npm audit
        working-directory: Backend
        run: npm audit --audit-level=high

      # =========================
      # Docker
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # Build Backend
      # =========================
      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest \
            ./Backend

      # =========================
      # Install Trivy
      # =========================
      - name: Run Trivy Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
      # =========================
      # Scan Backend Image
      # =========================
      - name: Scan Backend Image
        continue-on-error: true
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest

      # =========================
      # Push Backend
      # =========================
      - name: Push Backend Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest

      # =========================
      # Build Frontend
      # =========================
      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:latest \
            ./Frontend

      # =========================
      # Scan Frontend Image
      # =========================
      - name: Scan Frontend Image
        continue-on-error: true
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:latest

      # =========================
      # Push Frontend
      # =========================
      - name: Push Frontend Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:latest
