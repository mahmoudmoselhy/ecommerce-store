name: Build, Scan and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # ==========================
      # Checkout
      # ==========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================
      # Gitleaks
      # ==========================
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================
      # Semgrep
      # ==========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config auto

      # ==========================
      # Dependency Scan
      # ==========================
      - name: Install Backend Dependencies
        working-directory: Backend
        run: npm ci

      - name: Run npm audit
        working-directory: Backend
        run: npm audit --audit-level=high

      # ==========================
      # Docker Buildx
      # ==========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================
      # Docker Login
      # ==========================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ==========================
      # Backend Build
      # ==========================
      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest

      # ==========================
      # Backend Trivy Scan
      # ==========================
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # ==========================
      # Backend Push
      # ==========================
      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest

      # ==========================
      # Frontend Build
      # ==========================
      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:latest

      # ==========================
      # Frontend Trivy Scan
      # ==========================
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # ==========================
      # Frontend Push
      # ==========================
      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:latest
